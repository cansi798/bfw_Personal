m 10:45 Uhr bereiten wir in Ruhe den Raum vor, und um 11:00 Uhr schreiben Sie die Klausur. Nach der Mittagspause besprechen wir typische Klausurthemen, Sie geben mir Feedback zum Modul, und ich gebe Ihnen einen Ausblick auf das nächste Modul Marketing. Gibt es zum Ablauf noch eine Frage? Dann starten wir mit dem ersten Thema, der Berufsausbildung."}, {"layout": "split", "title": "Ausbildung im dualen System", "bullets": ["Zwei Lernorte, Betrieb und Berufsschule", "Vertrag in Textform, Probezeit 1 bis 4 Monate", "Vergütung Nordstern 1.150 €, Mindestwert 2026 724 €", "JArbSchG gilt bis unter 18 Jahre, z. B. Mia", "Weiterarbeit ohne Vereinbarung wird unbefristetes Arbeitsverhältnis"], "diagram": {"type": "compare", "left": {"title": "Ausbildungsbetrieb", "items": ["Ausbildungsordnung (Bund)", "Ausbildungsrahmenplan", "Ausbilderin Aylin Demir"]}, "right": {"title": "Berufsschule", "items": ["Rahmenlehrplan (KMK)", "Lernfeld 12 Personal", "Lehrkräfte der Länder"]}}, "quelle": "(Beiderwieden & Stickdorn, 2026), § 11 BBiG, § 20 BBiG, BBiMindVergFBek 2026", "notes": "Erinnern Sie sich an den ersten Tag? Die Ausbildung findet im dualen System statt, also an zwei Lernorten. Der Betrieb bildet nach der Ausbildungsordnung des Bundes aus, die Berufsschule unterrichtet nach dem Rahmenlehrplan der Kultusministerkonferenz. Zuständige Stelle für Nordstern ist die IHK zu Lübeck. Der Ausbildungsvertrag wird in Textform niedergeschrieben, das steht in § 11 BBiG. Die Probezeit dauert mindestens einen und höchstens vier Monate. Nordstern zahlt im ersten Jahr 1.150 Euro, die Mindestausbildungsvergütung für einen Beginn im Jahr 2026 liegt bei 724 Euro. Für Mia Schulz mit 17 Jahren gilt zusätzlich das Jugendarbeitsschutzgesetz, für Leon mit 19 Jahren nicht mehr. Und was passiert, wenn ein Azubi nach der Prüfung einfach weiterarbeitet, ohne dass etwas vereinbart ist? Richtig, dann entsteht ein unbefristetes Arbeitsverhältnis nach § 24 BBiG. Prüfen Sie Ihr Wissen jetzt an einem kleinen Fall."}, {"layout": "aufgabe", "title": "Wiederholung Ausbildung", "aufgabe": "Mia Schulz (17) und Leon Becker (19) haben dienstags Berufsschule mit 6 Unterrichtsstunden zu je 45 Minuten. Müssen beide danach noch in den Betrieb? Wie viele Werktage Urlaub hat Mia im Jahr 2026 dem Grunde nach?", "solution": {"bullets": ["Nein, beide sind nach diesem Berufsschultag freigestellt", "Mia nach § 9 JArbSchG, Leon nach § 15 BBiG", "Der Tag zählt mit 7 Stunden Arbeitszeit (35 ÷ 5)", "Mia hat 27 Werktage, weil sie am 01.01.2026 noch 16 war", "2026 erhält sie davon 5/12, Beginn war der 01.08."]}, "notes": "Lösen Sie diese Aufgabe bitte zu zweit, Sie haben zwei Minuten. Achten Sie darauf, dass Mia und Leon unterschiedlich alt sind. Gilt für beide dasselbe Gesetz? Wer hat ein Ergebnis? Für Mia gilt § 9 JArbSchG. Ein Berufsschultag mit mehr als fünf Unterrichtsstunden zu 45 Minuten ist einmal pro Woche ein freier Tag im Betrieb. Für Leon gilt dieselbe Regel, aber aus § 15 BBiG, denn das Berufsbildungsgesetz schützt seit 2020 auch volljährige Auszubildende. Der Berufsschultag wird mit der durchschnittlichen täglichen Arbeitszeit angerechnet, bei 35 Stunden in der Woche also mit 7 Stunden. Beim Urlaub zählt das Alter zu Beginn des Kalenderjahres. Mia war am 01.01.2026 noch 16, deshalb hat sie 27 Werktage nach § 19 JArbSchG. Weil sie erst am 01.08. begonnen hat, bekommt sie 2026 nur fünf Zwölftel. Gehen wir weiter zur Personalplanung."}, {"layout": "split", "title": "Personalplanung Montage 2027", "bullets": ["Bruttobedarf 180.000 Std. ÷ 1.500 Std. = 120", "Fortgeschriebener Bestand 100 − 7 + 2 = 95", "Nettobedarf 120 − 95 = 25 einstellen", "Qualitativ mit Stellenbeschreibung und Anforderungsprofil", "ArbZG 8, höchstens 10 Std. täglich, 11 Std. Ruhe"], "diagram": {"type": "waterfall", "items": [{"label": "Ist 2026", "value": 100}, {"label": "Abgänge", "value": -7}, {"label": "Zugänge", "value": 2}], "total_label": "Bestand 2027"}, "quelle": "(Beiderwieden & Stickdorn, 2026), § 3 ArbZG, § 5 ArbZG", "notes": "Am zweiten Tag haben wir den Personalbedarf der Montage berechnet. Nordstern will 2027 genau 36.000 Räder bauen, jedes Rad braucht fünf Montagestunden. Das ergibt 180.000 Stunden. Eine Vollzeitkraft leistet 1.500 produktive Stunden im Jahr, also braucht Nordstern 120 Vollzeitkräfte. Das ist der Bruttopersonalbedarf. Wie viele Menschen sind 2027 noch da? Wir nehmen den Ist-Bestand von 100, ziehen sieben sichere Abgänge ab und zählen zwei übernommene Auszubildende dazu. Das Schaubild zeigt diesen Weg zu 95. Der Nettopersonalbedarf ist dann 120 minus 95, also 25 Personen. Positiv heißt einstellen, negativ hieße freistellen. Zur Planung gehört auch die Frage, welche Qualifikationen gebraucht werden, also der qualitative Bedarf. Und bei der Arbeitszeit gilt das Arbeitszeitgesetz mit acht Stunden, höchstens zehn Stunden am Tag und elf Stunden Ruhezeit. Rechnen Sie das jetzt selbst noch einmal nach."}, {"layout": "aufgabe", "title": "Wiederholung Personalplanung", "aufgabe": "Nordstern plant 2027 genau 36.000 Räder. Jedes Rad braucht 5 Montagestunden, eine Vollzeitkraft leistet 1.500 produktive Stunden im Jahr. Ist-Bestand 100, Abgänge 7, sichere Zugänge 2. Berechnen Sie den Bruttobedarf und teilen Sie den Bedarf in Neubedarf und Ersatzbedarf auf.", "solution": {"bullets": ["36.000 × 5 = 180.000 Std. ÷ 1.500 = 120 Kräfte", "Neubedarf 120 − 100 = 20 zusätzliche Stellen", "Ersatzbedarf 7 für Rente und Eigenkündigungen", "20 + 7 − 2 sichere Zugänge = 25 einstellen", "Probe 120 − 95 = 25 Nettopersonalbedarf"]}, "notes": "Rechnen Sie bitte allein, danach vergleichen Sie mit Ihrem Nachbarn. Schreiben Sie jeden Schritt auf, so wie Sie es in der Klausur auch tun sollten. Was ist der erste Schritt? Genau, wir brauchen den gesamten Arbeitszeitbedarf in Stunden. 36.000 mal 5 ergibt 180.000 Stunden. Geteilt durch 1.500 Stunden je Kraft ergibt 120. Der Neubedarf entsteht durch die höhere Produktion, also 120 minus 100 gleich 20 zusätzliche Stellen. Der Ersatzbedarf ersetzt die sieben Personen, die durch Rente oder eigene Kündigung gehen. Zusammen sind das 27. Davon ziehen wir die zwei Auszubildenden ab, die sicher übernommen werden. Es bleiben 25. Die Probe mit dem fortgeschriebenen Bestand ergibt dasselbe Ergebnis. Ein typischer Fehler ist, die Zugänge zu vergessen. Dann käme man auf 27 und verliert Punkte. Weiter geht es mit der Frage, wie Nordstern diese 25 Menschen findet."}, {"layout": "split", "title": "Personalbeschaffung und Auswahl", "bullets": ["Intern günstig und schnell, extern mehr Auswahl", "Stellenanzeige AGG-konform, z. B. mit (m/w/d)", "Anzeige 1.200 €, Personalberater 9.480 €", "Auswahl mit Gespräch und Assessment-Center", "Einstellung braucht Zustimmung des Betriebsrats"], "diagram": {"type": "funnel", "stages": [{"label": "Bewerbungen", "value": "64"}, {"label": "Engere Wahl", "value": "12"}, {"label": "Vorstellungsgespräche", "value": "5"}, {"label": "Einstellung", "value": "1"}]}, "quelle": "(Beiderwieden & Stickdorn, 2026), § 11 AGG, § 99 BetrVG", "notes": "Am dritten Tag ging es um die Personalbeschaffung. Intern ist günstig, schnell und motiviert die Belegschaft, extern bringt mehr Auswahl und neue Ideen. Der Betriebsrat kann nach § 93 BetrVG verlangen, dass Stellen zuerst intern ausgeschrieben werden. Jede Stellenanzeige muss zum Allgemeinen Gleichbehandlungsgesetz passen, also neutral für alle Geschlechter und ohne Altersgrenzen. Erinnern Sie sich an die Kosten? Die Online-Anzeige kostete 1.200 Euro. Ein Personalberater hätte 20 Prozent eines Jahresgehalts verlangt, bei 3.950 Euro mal 12 also 9.480 Euro. Der Trichter zeigt die Auswahl für die Stelle Sachbearbeitung Personal. Aus 64 Bewerbungen kamen 12 in die engere Wahl, 5 Personen kamen zum Gespräch, eine wurde eingestellt. Vor der Einstellung muss der Betriebsrat nach § 99 BetrVG zustimmen. Er hat dafür eine Woche Zeit. Prüfen Sie nun eine Stellenanzeige auf Fehler."}, {"layout": "aufgabe", "title": "Wiederholung Personalbeschaffung", "aufgabe": "Prüfen Sie den Anzeigentext „Wir suchen einen jungen Sachbearbeiter Personal mit Deutsch als Muttersprache für unser junges Team.“ Nennen Sie die Fehler und die Frist, in der eine benachteiligte Person einen Anspruch geltend machen muss.", "solution": {"bullets": ["„einen Sachbearbeiter“ benachteiligt wegen Geschlecht, besser (m/w/d)", "„jungen“ und „junges Team“ benachteiligen wegen Alter", "„Muttersprache“ benachteiligt wegen Herkunft, besser Sprachniveau nennen", "Verstoß gegen § 11 AGG in Verbindung mit § 7 AGG", "Anspruch schriftlich innerhalb von 2 Monaten (§ 15 Abs. 4 AGG)"]}, "notes": "Lesen Sie den Satz bitte genau. Wie viele Fehler finden Sie? Diskutieren Sie kurz zu zweit. Die Anzeige enthält drei Benachteiligungen. Erstens spricht sie nur Männer an, weil sie einen Sachbearbeiter sucht. Richtig wäre Sachbearbeitung Personal mit dem Zusatz m, w, d. Zweitens benachteiligen die Wörter jung und junges Team ältere Menschen wegen des Alters. Drittens schließt Muttersprache Deutsch Menschen anderer Herkunft aus, obwohl sie sehr gut Deutsch sprechen können. Besser ist ein Sprachniveau, das für die Stelle wirklich nötig ist. Wer benachteiligt wurde, muss seinen Anspruch innerhalb von zwei Monaten schriftlich geltend machen. Die Entschädigung kann bis zu drei Monatsgehälter betragen, wenn die Person auch ohne Benachteiligung nicht eingestellt worden wäre. Beachten Sie, eine Verlängerung der Frist ist nur geplant und nicht beschlossen. In der Klausur gilt die Zwei-Monats-Frist. Kommen wir zur Einstellung."}, {"layout": "split", "title": "Arbeitsvertrag mit und ohne Tarif", "bullets": ["Arbeitsvertrag formfrei, Befristung nur schriftlich", "Sachgrundlos bis 2 Jahre, höchstens 3 Verlängerungen", "Probezeit höchstens 6 Monate, Kündigungsfrist 2 Wochen", "Tarifvertrag gilt unmittelbar und zwingend", "DEÜV-Anmeldung, keine Sofortmeldung bei Nordstern"], "diagram": {"type": "tree", "root": "Arbeitsvertrag", "children": [{"label": "Mit Tarifbindung", "children": ["Manteltarifvertrag", "Entgelttarifvertrag", "Günstigkeitsprinzip"]}, {"label": "Ohne Tarifbindung", "children": ["Mindestlohn 13,90 €", "BUrlG 24 Werktage", "EFZG 6 Wochen"]}]}, "quelle": "(Beiderwieden & Stickdorn, 2026), § 14 Abs. 4 TzBfG, § 4 Abs. 3 TVG, § 622 Abs. 3 BGB", "notes": "Am vierten Tag ging es um den Arbeitsvertrag. Ein Arbeitsvertrag ist grundsätzlich formfrei, er gilt also auch mündlich. Der Arbeitgeber muss aber die wesentlichen Bedingungen nach dem Nachweisgesetz aushändigen, seit 2025 auch in Textform. Eine Befristung braucht dagegen immer die Schriftform mit Unterschrift. Ohne Sachgrund darf ein Vertrag bis zu zwei Jahre befristet werden, mit höchstens drei Verlängerungen. Nordstern ist tarifgebunden. Der Tarifvertrag gilt unmittelbar und zwingend, Abweichungen sind nur zugunsten der Beschäftigten erlaubt. Wie heißt dieses Prinzip? Richtig, Günstigkeitsprinzip. Die Tochter Nordstern Service GmbH hat keinen Tarif. Dort gelten die gesetzlichen Mindeststandards, also Mindestlohn, Mindesturlaub, Entgeltfortzahlung, Arbeitszeitgesetz und AGG. Bei der Einstellung meldet Nordstern neue Beschäftigte mit der DEÜV-Anmeldung bei der Krankenkasse. Eine Sofortmeldung braucht Nordstern nicht, weil die Fahrradherstellung nicht zu den Branchen in § 28a Abs. 4 SGB IV gehört."}, {"layout": "aufgabe", "title": "Wiederholung Personaleinstellung", "aufgabe": "Richtig oder falsch? (1) Ein befristeter Vertrag als PDF per E-Mail ist wirksam befristet. (2) Die Nordstern Service GmbH darf 2026 nicht weniger als 13,90 € je Stunde zahlen. (3) Ein Tarifvertrag darf zugunsten der Beschäftigten überschritten werden. (4) Entgeltfortzahlung im Krankheitsfall gibt es ab dem ersten Arbeitstag.", "solution": {"bullets": ["(1) Falsch, Befristung braucht Schriftform, sonst gilt unbefristet", "(2) Richtig, Mindestlohn 13,90 € seit 01.01.2026 (MiLoV5)", "(3) Richtig, Günstigkeitsprinzip nach § 4 Abs. 3 TVG", "(4) Falsch, Anspruch erst nach 4 Wochen (§ 3 Abs. 3 EFZG)"]}, "notes": "Entscheiden Sie bei jeder Aussage zuerst allein, ob sie richtig oder falsch ist, und begründen Sie kurz. Danach zeige ich die Lösung. Aussage eins ist falsch. Eine Befristung braucht nach § 14 Abs. 4 TzBfG die Schriftform, also Papier mit eigenhändiger Unterschrift. Ein PDF per E-Mail ist nur Textform. Fehlt die Schriftform, gilt der Vertrag als unbefristet. Aussage zwei ist richtig, seit dem 01.01.2026 beträgt der Mindestlohn 13,90 Euro je Stunde, ab 2027 steigt er auf 14,60 Euro. Aussage drei ist richtig, das ist das Günstigkeitsprinzip. Aussage vier ist falsch. Der Anspruch auf Entgeltfortzahlung entsteht erst nach vier Wochen ununterbrochenem Arbeitsverhältnis und gilt dann bis zu sechs Wochen. Wie viele von Ihnen hatten alle vier richtig? Sehr gut. Jetzt kommt das Thema mit den meisten Zahlen, das Entgelt."}, {"layout": "split", "title": "Entgelt und Gehaltsabrechnung 2026", "bullets": ["Zeitlohn, Akkordlohn, Prämienlohn, Erfolgsbeteiligung", "SV 2026 KV 17,5 %, PV 3,6 %, RV 18,6 %, AV 2,6 %", "Kinderlose ab 23 zahlen 0,6 Punkte PV mehr", "Lohnsteuer aus dem Tabellenauszug ablesen"], "diagram": {"type": "staffel", "rows": [{"label": "Bruttoentgelt Lisa", "value": "3.950,00 €", "kind": "start"}, {"label": "Lohnsteuer", "value": "− 512,25 €", "kind": "minus"}, {"label": "Kirchensteuer 9 %", "value": "− 46,10 €", "kind": "minus"}, {"label": "SV-Anteil Arbeitnehmerin", "value": "− 859,13 €", "kind": "minus"}, {"label": "Nettoentgelt", "value": "2.532,52 €", "kind": "result"}]}, "quelle": "(Beiderwieden & Stickdorn, 2026), (TK, 2026b), (BMG, 2025), § 55 Abs. 3 SGB XI", "notes": "Am fünften Tag haben wir Entgelte berechnet. Zuerst die Entgeltformen, also Zeitlohn und Gehalt, Akkordlohn, Prämienlohn und Erfolgsbeteiligung. Dann die Abzüge. Die Sozialversicherung hat 2026 diese Sätze. Krankenversicherung 14,6 Prozent plus durchschnittlicher Zusatzbeitrag 2,9 Prozent, zusammen 17,5 Prozent. Pflegeversicherung 3,6 Prozent, Rentenversicherung 18,6 Prozent, Arbeitslosenversicherung 2,6 Prozent. Arbeitnehmer und Arbeitgeber teilen sich die Beiträge je zur Hälfte. Wer zahlt den Kinderlosenzuschlag von 0,6 Punkten? Richtig, nur kinderlose Beschäftigte ab 23 Jahren, also Lisa Wagner, aber nicht Mia. Die Staffel zeigt die Abrechnung von Lisa. Vom Brutto 3.950 Euro gehen 512,25 Euro Lohnsteuer aus der Tabelle, 46,10 Euro Kirchensteuer und 859,13 Euro Sozialversicherung ab. Es bleiben 2.532,52 Euro netto. Wie wird das gebucht? Das sehen wir auf der nächsten Folie."}, {"layout": "beispiel", "title": "Beispiel Buchung Gehalt Lisa Wagner", "text": "Lisa Wagner arbeitet im Vertrieb, darum bucht Nordstern ihr Gehalt auf 6300 Gehälter. Die Sozialversicherungsbeiträge wurden am 26.11.2026 über 2640 SV-Vorauszahlung vorausgezahlt.", "table": {"head": ["Soll", "Betrag", "Haben", "Betrag"], "rows": [["6300 Gehälter", "3.950,00 €", "2800 Bank", "2.532,52 €"], ["", "", "4830 Verb. gegenüber Finanzbehörden", "558,35 €"], ["", "", "2640 SV-Vorauszahlung", "859,13 €"], ["6410 AG-Anteil SV Gehaltsbereich", "835,43 €", "2640 SV-Vorauszahlung", "835,43 €"]]}, "bullets": ["Arbeitgeberkosten 3.950,00 € + 835,43 € = 4.785,43 €"], "quelle": "(Westermann Gruppe, 2025), (Westermann Gruppe, 2021)", "notes": "So bucht Nordstern das Gehalt von Lisa im Industriekontenrahmen. Im Soll steht der Aufwand 6300 Gehälter mit dem vollen Brutto von 3.950 Euro. Im Haben stehen drei Positionen. Die Bank zahlt das Netto von 2.532,52 Euro aus. Lohnsteuer und Kirchensteuer, zusammen 558,35 Euro, sind eine Verbindlichkeit gegenüber dem Finanzamt auf 4830. Der Arbeitnehmeranteil zur Sozialversicherung von 859,13 Euro wird gegen 2640 gebucht. Warum gegen 2640? Weil Nordstern die Beiträge schon am drittletzten Bankarbeitstag an die Krankenkasse überwiesen hat, also vor der Gehaltszahlung. Mit der zweiten Buchung kommt der Arbeitgeberanteil von 835,43 Euro auf 6410, weil Lisa im Gehaltsbereich arbeitet. Für Jonas aus der Montage wären es 6200 und 6400. Die Arbeitgeberkosten für Lisa betragen also 4.785,43 Euro. Merken Sie sich, ein Konto 4840 gibt es in unserem Kontenrahmen nicht. Jetzt üben wir noch den Akkordlohn."}, {"layout": "aufgabe", "title": "Wiederholung Akkordlohn", "aufgabe": "Montage Lastenrad-Rahmen. Grundlohn 20,00 € je Stunde, Akkordzuschlag 20 %, Vorgabezeit 15 Minuten je Stück. Ein Monteur schafft in 8 Stunden 40 Stück. Berechnen Sie Stückgeld, Tageslohn und Leistungsgrad.", "solution": {"bullets": ["Akkordrichtsatz 20,00 € + 20 % = 24,00 € je Std.", "Normalleistung 60 ÷ 15 = 4 Stück je Std.", "Stückgeld 24,00 € ÷ 4 = 6,00 € je Stück", "Tageslohn 40 × 6,00 € = 240,00 €", "Leistungsgrad 5 ÷ 4 × 100 = 125 %"]}, "notes": "Diese Rechnung kommt sehr gern in Prüfungen vor. Rechnen Sie bitte zu zweit, Sie haben drei Minuten. Was rechnen Sie zuerst? Zuerst den Akkordrichtsatz, also Grundlohn plus Akkordzuschlag. 20 Euro plus 20 Prozent sind 24 Euro je Stunde. Dann die Normalleistung. Bei 15 Minuten Vorgabezeit schafft man normal vier Stück in 60 Minuten. Das Stückgeld ist 24 Euro geteilt durch vier, also 6 Euro je Stück. Der Monteur schafft 40 Stück in acht Stunden. Er verdient 40 mal 6 Euro, also 240 Euro. Bei Normalleistung wären es nur 8 mal 24 Euro gleich 192 Euro gewesen. Er schafft fünf statt vier Stück je Stunde, das ist ein Leistungsgrad von 125 Prozent. Und was passiert, wenn jemand nur drei Stück schafft? Dann bekommt er trotzdem den garantierten Grundlohn von 20 Euro je Stunde. Damit ist die erste Woche wiederholt. Weiter mit der Personalentwicklung."}, {"layout": "split", "title": "Personalentwicklung", "bullets": ["Drei Bereiche Bildung, Förderung, Organisationsentwicklung", "Lernorte on, near und off the job", "Enlargement mehr gleiche Aufgaben, Enrichment mehr Verantwortung", "Nordstern 2025 im Schnitt 3,0 Weiterbildungstage"], "diagram": {"type": "cycle", "steps": ["Bedarfsanalyse", "Ziele", "Planung", "Durchführung", "Erfolgskontrolle", "Transfer"]}, "quelle": "(Beiderwieden & Stickdorn, 2026), (Oechsler & Paul, 2019)", "notes": "Willkommen in der zweiten Woche. Am sechsten Tag ging es um Personalentwicklung. Im Kurs verwenden wir die weite Bedeutung mit drei Bereichen, Bildung, Förderung und Organisationsentwicklung. Zur Bildung gehören Ausbildung, Fortbildung und Umschulung. Sie selbst sind übrigens gerade in einer Umschulung. Zur Förderung gehören zum Beispiel Karriereplanung, Job Rotation und Coaching. Wo findet Lernen statt? On the job heißt am Arbeitsplatz, near the job arbeitsplatznah, zum Beispiel im Qualitätszirkel, und off the job außerhalb, etwa im Seminar. Wichtig für die Klausur ist der Unterschied zwischen Job Enlargement und Job Enrichment. Enlargement bringt mehr Aufgaben auf gleichem Niveau, Enrichment bringt mehr Verantwortung. Der Kreislauf zeigt den Personalentwicklungsprozess von der Bedarfsanalyse bis zum Transfer in den Arbeitsalltag. Nordstern hatte 2025 im Schnitt 3,0 Weiterbildungstage je Beschäftigten, also 708 Tage geteilt durch 236. Ordnen Sie jetzt einige Fälle zu."}, {"layout": "aufgabe", "title": "Wiederholung Personalentwicklung", "aufgabe": "Ordnen Sie zu. (a) Azubi Leon wechselt alle drei Monate die Abteilung. (b) Ein Lagerist übernimmt neben dem Einlagern auch das Verpacken. (c) Eine Teamleiterin erhält eigene Budgetverantwortung. (d) Sven Krüger besucht ein Seminar zur Entgeltabrechnung bei der IHK.", "solution": {"bullets": ["(a) Job Rotation, planmäßiger Wechsel des Arbeitsplatzes", "(b) Job Enlargement, mehr Aufgaben auf gleichem Niveau", "(c) Job Enrichment, mehr Verantwortung und Entscheidung", "(d) Fortbildung off the job, außerhalb des Arbeitsplatzes"]}, "notes": "Ordnen Sie die vier Fälle bitte allein zu und vergleichen Sie danach. Bei welchem Fall sind Sie unsicher? Meist verwechseln Teilnehmende die Fälle b und c. Fall a ist Job Rotation, denn Leon wechselt planmäßig die Arbeitsplätze und lernt so den ganzen Betrieb kennen. Fall b ist Job Enlargement. Der Lagerist bekommt eine weitere Aufgabe, die etwa genauso anspruchsvoll ist. Man nennt das auch eine horizontale Erweiterung. Fall c ist Job Enrichment, denn die Teamleiterin darf jetzt selbst über Geld entscheiden und trägt mehr Verantwortung. Das ist eine Erweiterung nach oben, also vertikal. Fall d ist eine Fortbildung, und weil das Seminar außerhalb des Arbeitsplatzes stattfindet, ist es off the job. Ein Tipp für die Klausur, verbinden Sie Enrichment mit dem Wort reich, also reich an Verantwortung. Kommen wir nun zur Personalführung."}, {"layout": "split", "title": "Führung und Motivation", "bullets": ["Führungsstile autoritär, kooperativ, Laissez-faire, situativ", "Situativ heißt Stil nach Reifegrad wählen", "Herzberg unterscheidet Hygienefaktoren und Motivatoren", "McGregor beschreibt Theorie X und Theorie Y", "MbO Ziele, MbE Ausnahmen, MbD Delegation"], "diagram": {"type": "pyramid", "levels": ["Selbstverwirklichung", "Wertschätzung", "Soziale Bedürfnisse", "Sicherheit", "Physiologische Bedürfnisse"]}, "quelle": "(Maslow, 1943), (Herzberg et al., 1959), (McGregor, 1960), (Hersey & Blanchard, 1969)", "notes": "Am siebten Tag ging es um Führung. Wir haben die Führungsstile von autoritär über kooperativ bis Laissez-faire unterschieden. Beim situativen Führen nach Hersey und Blanchard richtet sich der Stil nach dem Reifegrad der Mitarbeitenden, also nach Können und Wollen. Eine neue Auszubildende braucht klare Anweisungen, ein erfahrener Monteur kann Aufgaben selbst übernehmen. Die Pyramide zeigt die Bedürfnisse nach Maslow. Unten stehen die körperlichen Bedürfnisse, oben die Selbstverwirklichung. Eine höhere Stufe wird erst wichtig, wenn die untere weitgehend erfüllt ist. Herzberg trennt Hygienefaktoren wie Entgelt, die nur Unzufriedenheit verhindern, und Motivatoren wie Anerkennung, die wirklich motivieren. McGregor beschreibt zwei Menschenbilder. Theorie X sieht Menschen als arbeitsscheu, Theorie Y als leistungsbereit. Bei den Führungstechniken führt Management by Objectives über Ziele, Management by Exception greift nur bei Ausnahmen ein und Management by Delegation überträgt Aufgaben mit Verantwortung. Probieren Sie das gleich aus."}, {"layout": "aufgabe", "title": "Wiederholung Personalführung", "aufgabe": "Ordnen Sie nach Herzberg zu. Gehaltserhöhung, Lob durch die Personalleitung, neue Kantine, eigenes Projekt mit Verantwortung. Welche Führungstechnik nutzt Malte Brandt, wenn er nur eingreift, wenn ein Team sein Budget deutlich überschreitet?", "solution": {"bullets": ["Hygienefaktoren sind Gehaltserhöhung und neue Kantine", "Motivatoren sind Lob und Projekt mit Verantwortung", "Hygiene verhindert Unzufriedenheit, motiviert aber nicht dauerhaft", "Eingreifen nur bei Abweichungen ist Management by Exception"]}, "notes": "Arbeiten Sie bitte zu zweit. Überlegen Sie bei jedem Punkt, ob er Unzufriedenheit verhindert oder echte Motivation erzeugt. Was haben Sie herausgefunden? Die Gehaltserhöhung und die neue Kantine sind Hygienefaktoren. Fehlen sie, sind die Beschäftigten unzufrieden. Sind sie vorhanden, ist man zufrieden, aber nicht unbedingt motiviert. Das Lob und das eigene Projekt sind Motivatoren, denn sie betreffen Anerkennung, Arbeitsinhalt und Verantwortung. Viele denken, Geld motiviere am stärksten. Nach Herzberg wirkt Geld aber vor allem als Hygienefaktor. Zur zweiten Frage. Malte Brandt lässt seine Teams im Normalfall selbst arbeiten und greift nur ein, wenn eine festgelegte Grenze überschritten wird. Das ist Management by Exception. Würde er stattdessen mit dem Team Ziele vereinbaren, wäre es Management by Objectives. Damit kommen wir zum achten Thema, der Personalfreistellung."}, {"layout": "split", "title": "Kündigung und Kündigungsschutz", "bullets": ["Ordentlich mit Frist, außerordentlich aus wichtigem Grund", "Immer schriftlich, keine E-Mail (§ 623 BGB)", "KSchG ab 6 Monaten und mehr als 10 Arbeitnehmern", "Gründe in Person, Verhalten oder Betrieb", "Besonderer Schutz, z. B. Schwangere und Betriebsrat"], "diagram": {"type": "flow", "steps": ["Betriebsrat anhören", "Kündigung schriftlich", "Zugang beim Arbeitnehmer", "Frist läuft", "Klage binnen 3 Wochen"]}, "quelle": "(Beiderwieden & Stickdorn, 2026), § 102 BetrVG, § 1 KSchG, § 4 KSchG", "notes": "Am achten Tag ging es um die Personalfreistellung. Neben der Kündigung gibt es interne Wege wie Versetzung oder Abbau von Überstunden und den Aufhebungsvertrag. Bei der Kündigung unterscheiden wir die ordentliche Kündigung mit Frist, die außerordentliche Kündigung aus wichtigem Grund und die Änderungskündigung. Jede Kündigung muss schriftlich sein, eine E-Mail oder WhatsApp reicht nicht. Bei Nordstern gilt das Kündigungsschutzgesetz, weil der Betrieb mehr als zehn Arbeitnehmer hat. Nach sechs Monaten im Betrieb braucht eine Kündigung einen Grund in der Person, im Verhalten oder aus dringenden betrieblichen Erfordernissen. Bei betriebsbedingten Kündigungen kommt die Sozialauswahl dazu. Das Schaubild zeigt den Ablauf. Vor jeder Kündigung wird der Betriebsrat angehört, sonst ist die Kündigung unwirksam. Ab dem Zugang läuft die Frist, und der Arbeitnehmer hat drei Wochen Zeit für eine Klage. Wer hat zusätzlich besonderen Schutz? Zum Beispiel Schwangere, Beschäftigte in Elternzeit, schwerbehinderte Menschen und Betriebsratsmitglieder."}, {"layout": "beispiel", "title": "Beispiel Kündigungsfrist Thomas Albers", "text": "Thomas Albers arbeitet seit 01.03.2014 im Lager. Die Kündigung durch Nordstern geht ihm am Mittwoch, 02.12.2026 zu. Der Betriebsrat wurde vorher angehört.", "table": {"head": ["Schritt", "Ergebnis"], "rows": [["Betriebszugehörigkeit bei Zugang", "12 Jahre und 9 Monate"], ["Frist nach § 622 Abs. 2 BGB", "5 Monate zum Monatsende"], ["5 Monate ab Zugang", "02.05.2027"], ["Ende zum nächsten Monatsende", "31.05.2027"], ["Klagefrist 3 Wochen nach § 4 KSchG", "bis 23.12.2026"]]}, "quelle": "§ 622 Abs. 2 BGB, § 4 KSchG", "notes": "Dieses Beispiel kennen Sie vom achten Tag. Thomas Albers arbeitet seit dem 01.03.2014 bei Nordstern. Am 02.12.2026 ist er also 12 Jahre und 9 Monate im Betrieb. Welche Stufe in § 622 Abs. 2 BGB gilt? Die Stufe für 12 Jahre, also fünf Monate zum Monatsende. Die Stufe für 15 Jahre hat er noch nicht erreicht. Sein Alter von 47 Jahren spielt keine Rolle, denn alle Beschäftigungsjahre zählen. Fünf Monate ab dem Zugang enden am 02.05.2027. Weil die Frist zum Monatsende läuft, endet das Arbeitsverhältnis am 31.05.2027. Wenn Herr Albers klagen will, muss er das innerhalb von drei Wochen nach Zugang tun, also bis zum 23.12.2026. Außerdem muss er sich spätestens drei Monate vor dem Ende arbeitsuchend melden, besser sofort. In der Klausur schreiben Sie bitte jeden Schritt so auf wie in dieser Tabelle. Prüfen Sie jetzt noch zwei kurze Fragen."}, {"layout": "aufgabe", "title": "Wiederholung Freistellung und Zeugnis", "aufgabe": "(a) Welche Note bedeutet der Zeugnissatz „Er erledigte seine Aufgaben stets zu unserer vollen Zufriedenheit“? (b) Thomas Albers möchte selbst kündigen. Welche Frist gilt für ihn, wenn Vertrag und Tarif nichts anderes regeln?", "solution": {"bullets": ["(a) Note gut, „stets“ und „vollen“ zeigen die 2", "Für sehr gut stünde „stets zu unserer vollsten Zufriedenheit“", "(b) Grundfrist 4 Wochen zum 15. oder zum Monatsende", "Die längeren Fristen gelten nur für den Arbeitgeber", "Rechtsgrundlagen § 109 GewO und § 622 Abs. 1 BGB"]}, "notes": "Zwei kurze Fragen zum Abschluss des Themas. Überlegen Sie bitte zuerst allein. Zu a. Der Satz stets zu unserer vollen Zufriedenheit steht für die Note gut. Das Wort stets zeigt, dass die Leistung immer so war, und volle Zufriedenheit ist eine Stufe unter vollster Zufriedenheit. Ein qualifiziertes Zeugnis mit Leistung und Verhalten gibt es nur auf Verlangen. Ein einfaches Zeugnis nennt nur Art und Dauer der Tätigkeit. Das steht in § 109 GewO. Zu b. Viele denken, Herr Albers müsse auch fünf Monate einhalten. Das stimmt nicht. Die verlängerten Fristen in § 622 Abs. 2 BGB gelten nur für Kündigungen durch den Arbeitgeber. Für ihn gilt die Grundfrist von vier Wochen zum 15. oder zum Ende eines Monats. Wer hatte beide Antworten richtig? Prima. Kommen wir zum letzten Thema, dem Personalcontrolling."}, {"layout": "split", "title": "Personalcontrolling und Kennzahlen", "bullets": ["Funktionen Information, Planung, Steuerung, Kontrolle, Frühwarnung", "Strategisch langfristig, operativ kurzfristig", "Quoten mit Ø Bestand von 236 Beschäftigten", "Ausbildungsquote mit Stichtagsbestand 240", "Krankenstand Deutschland 2025 im Schnitt 5,9 %"], "diagram": {"type": "bars", "items": [{"label": "Fluktuation", "value": 5.93}, {"label": "Krankenquote", "value": 6.0}, {"label": "Überstunden", "value": 2.6}, {"label": "Ausbildung", "value": 4.17}], "unit": "%"}, "quelle": "(Beiderwieden & Stickdorn, 2026), (Destatis, 2026)", "notes": "Am neunten Tag ging es um das Personalcontrolling. Es liefert Informationen, unterstützt Planung und Steuerung, kontrolliert über Soll-Ist-Vergleiche und warnt früh vor Problemen. Strategisches Controlling denkt langfristig, zum Beispiel an die Altersstruktur. Operatives Controlling denkt kurzfristig, zum Beispiel an das Budget des nächsten Monats. Das Diagramm zeigt vier Quoten von Nordstern für 2025. Die Fluktuationsquote liegt bei 5,93 Prozent, die Krankenquote bei 6,00 Prozent, die Überstundenquote bei 2,60 Prozent und die Ausbildungsquote bei 4,17 Prozent. Die Personalaufwandsquote von 32,5 Prozent passt nicht auf diese Skala. Mit welchem Bestand rechnen wir? Mit dem durchschnittlichen Bestand von 236. Nur die Ausbildungsquote rechnen wir mit dem Stichtagsbestand von 240. Zum Vergleich, in Deutschland waren 2025 im Schnitt 5,9 Prozent der Beschäftigten krankgemeldet. Nordstern liegt also etwa im Durchschnitt. Rechnen Sie drei Kennzahlen selbst nach."}, {"layout": "aufgabe", "title": "Wiederholung Personalkennzahlen", "aufgabe": "Nordstern 2025. Durchschnittlicher Bestand 236, Kündigungen durch Beschäftigte 14, Krankheitstage 3.115, Soll-Arbeitstage je Kopf 220, Personalaufwand 15,6 Mio. €, Umsatz 48,0 Mio. €. Berechnen Sie Fluktuationsquote, Krankenquote und Personalaufwandsquote.", "solution": {"bullets": ["Fluktuationsquote 14 ÷ 236 × 100 = 5,93 %", "Soll-Arbeitstage 236 × 220 = 51.920 Tage", "Krankenquote 3.115 ÷ 51.920 × 100 = 6,00 %", "Personalaufwandsquote 15,6 ÷ 48,0 × 100 = 32,5 %"]}, "notes": "Rechnen Sie bitte allein mit dem Taschenrechner, den Sie auch in der Klausur benutzen. Schreiben Sie zu jeder Kennzahl zuerst die Formel in Worten. Wie lautet die Formel der Fluktuationsquote? Kündigungen durch Beschäftigte geteilt durch den durchschnittlichen Bestand mal 100. Das ergibt 14 geteilt durch 236 mal 100 gleich 5,93 Prozent. Für die Krankenquote brauchen Sie zuerst die Soll-Arbeitstage, also 236 mal 220 gleich 51.920 Tage. Dann 3.115 geteilt durch 51.920 mal 100, das sind 6,00 Prozent. Die Personalaufwandsquote ist Personalaufwand geteilt durch Umsatz mal 100, also 32,5 Prozent. Fast ein Drittel des Umsatzes geht in das Personal. Denken Sie in der Klausur an die Deutung. Eine Zahl allein bringt wenig Punkte, erst der Vergleich mit Vorjahr, Ziel oder Branche macht sie aussagekräftig. Damit haben wir alle neun Themen wiederholt."}, {"layout": "section", "title": "Fit für die Klausur", "subtitle": "Operatoren lesen und Zeit planen", "notes": "Sie haben jetzt alle Themen noch einmal gesehen. Fachwissen ist das eine, aber in einer Klausur verlieren viele Menschen Punkte, obwohl sie den Stoff kennen. Woran liegt das? Meist an zwei Dingen. Erstens lesen sie die Aufgabe nicht genau und antworten zu kurz oder zu lang. Zweitens planen sie ihre Zeit nicht und schaffen die letzte Aufgabe nicht mehr. Deshalb schauen wir uns jetzt zwei Dinge an, die Operatoren und die Zeitplanung. Operatoren sind die Verben in einer Aufgabe, also zum Beispiel nennen, erklären, berechnen oder beurteilen. Sie sagen Ihnen genau, was Sie tun sollen und wie ausführlich die Antwort sein muss. Wer hat schon einmal in einer Prüfung zu viel geschrieben und dann Zeit verloren? Genau das wollen wir heute vermeiden. Schauen wir uns die wichtigsten Operatoren an.", "kicker": "Teil 1"}, {"layout": "merke", "title": "Operatoren richtig lesen", "box": {"type": "merke", "title": "Der Operator bestimmt die Antwort", "text": "Nennen heißt aufzählen ohne Erklärung. Erklären heißt einen Zusammenhang mit Begründung in eigenen Worten darstellen. Berechnen heißt Formel, Rechenweg, Ergebnis und Einheit aufschreiben. Beurteilen heißt Argumente abwägen und mit einem begründeten eigenen Urteil abschließen."}, "bullets": ["Nennen kurz, ein Begriff je Punkt", "Erklären mit weil und dadurch", "Berechnen mit Formel, Weg und Einheit", "Beurteilen mit Pro, Contra und Urteil"], "notes": "Hier sehen Sie vier Operatoren, die in fast jeder Klausur vorkommen. Nennen heißt aufzählen. Wenn die Aufgabe sagt, nennen Sie drei Gründe für eine Kündigung nach dem Kündigungsschutzgesetz, dann schreiben Sie Person, Verhalten und Betrieb. Mehr nicht. Erklären heißt, einen Zusammenhang verständlich zu machen. Hier helfen die Wörter weil und dadurch. Berechnen heißt, die Formel aufzuschreiben, die Zahlen einzusetzen, das Ergebnis zu nennen und die Einheit nicht zu vergessen, also Euro, Prozent oder Personen. Auch wenn das Ergebnis falsch ist, gibt es für einen richtigen Rechenweg oft Teilpunkte. Beurteilen ist der anspruchsvollste Operator. Sie nennen Argumente dafür und dagegen und schließen mit einem eigenen Urteil, das Sie begründen. Ein Beispiel wäre, beurteilen Sie, ob Nordstern die 25 Monteure intern oder extern beschaffen sollte. Welcher Operator fällt Ihnen am schwersten? Dann üben wir den heute im Aufgabenheft besonders."}, {"layout": "diagram", "title": "Zeitplanung in der Klausur", "diagram": {"type": "timeline", "events": [{"label": "Alles lesen, Punkte notieren", "date": "0 bis 5 Min."}, {"label": "Sichere Aufgaben zuerst", "date": "5 bis 35 Min."}, {"label": "Rechnungen mit Rechenweg", "date": "35 bis 65 Min."}, {"label": "Fälle und Beurteilen", "date": "65 bis 80 Min."}, {"label": "Kontrolle und Einheiten", "date": "80 bis 90 Min."}]}, "caption": "Vorschlag für 90 Minuten, die echte Dauer legt der Träger fest", "notes": "Dieser Zeitplan ist ein Vorschlag für eine Klausur von 90 Minuten. Die tatsächliche Dauer und die Punkte legt der Träger fest, ich sage sie Ihnen vor Beginn. Lesen Sie in den ersten fünf Minuten alle Aufgaben und notieren Sie die Punkte. Eine gute Faustregel lautet, ein Punkt entspricht etwa einer Minute. Beginnen Sie mit den Aufgaben, bei denen Sie sich sicher fühlen. Das gibt Ruhe und Punkte. Danach kommen die Rechnungen, bei denen Sie Zeit für den Rechenweg brauchen. Die Fälle und Beurteilungen kommen zum Schluss, denn hier können Sie aus dem Wissen der anderen Aufgaben schöpfen. Was machen Sie, wenn Sie bei einer Aufgabe hängen? Markieren Sie sie und gehen Sie weiter. Planen Sie die letzten zehn Minuten fest für die Kontrolle ein. Prüfen Sie Einheiten, Namen auf allen Blättern und ob Sie jede Teilaufgabe beantwortet haben. Zum Schluss fassen wir zusammen."}, {"layout": "summary", "title": "Zusammenfassung des Moduls", "bullets": ["Planen, beschaffen, einstellen, entlohnen, entwickeln, führen, freistellen, kontrollieren", "Rechnungen immer mit Formel, Rechenweg und Einheit", "Fälle immer mit Gesetz und Begründung lösen", "Operator lesen und Zeit nach Punkten planen", "Ab Montag, 07.12., folgt M-022 Marketing"], "notes": "Fassen wir zusammen. Personalwirtschaft ist ein Kreislauf. Ein Betrieb plant seinen Bedarf, beschafft und stellt Personal ein, entlohnt es, entwickelt und führt es, stellt es irgendwann frei und kontrolliert alles mit Kennzahlen. Die Ausbildung läuft im dualen System parallel und sichert den Nachwuchs. Für die Klausur gelten drei Regeln. Rechnungen schreiben Sie immer mit Formel, Rechenweg und Einheit. Fälle lösen Sie mit dem passenden Gesetz und einer kurzen Begründung. Und Sie lesen zuerst den Operator und planen Ihre Zeit nach den Punkten. Was nehmen Sie aus dieser Wiederholung mit? Sagen Sie mir bitte ein Wort. Jetzt machen wir eine Frühstückspause. Danac       var isText = e.tagName === "text";
      // Text: vertikal nur den Kern der Glyphen messen (Kalam hat große Ober- und Unterlängen)
      var fs = isText ? parseFloat(e.getAttribute("font-size") || "16") : 0;
      var vy = isText ? fs * 0.22 : 0;
      if (b.x < -tol || b.y + vy < -tol || b.x + b.w > VW + tol || b.y + b.h - vy > VH + tol) {
        res.overflow.push({ what: label.slice(0, 60), x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.w), h: Math.round(b.h) });
      }
      if (isText) {
        var bx = e.getAttribute("data-box");
        if (bx) {
          var q = boxInRoot(svg, e, bx.split(" ").map(Number));
          if (b.x < q[0] - tol || b.x + b.w > q[0] + q[2] + tol || b.y + vy < q[1] - tol - 2 || b.y + b.h - vy > q[1] + q[3] + tol + 2) {
            res.overflow.push({ what: "Text ragt aus Kasten: " + label.slice(0, 50), x: Math.round(b.x), y: Math.round(b.y), w: Math.round(b.w), h: Math.round(b.h) });
          }
        }

      }
    });

      var ox = Math.min(a.x2, c.x2) - Math.max(a.x, c.x), oy = Math.min(a.y2, c.y2) - Math.max(a.y, c.y);
      if (ox > 3 && oy > 3) res.overlap.push({ a: a.t.slice(0, 40), b: c.t.slice(0, 40), ox: Math.round(ox), oy: Math.round(oy) });
    }
    if (res.overflow.length || res.overlap.length) res.ok = false;
    return res;
  }

  function ready() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    return Promise.all([
      document.fonts.load("400 20px Kalam"), document.fonts.load("700 20px Kalam")
    ]).then(function () { return document.fonts.ready; }).catch(function () { return null; });
  }

/* ---------- Präsentationsmodus ---------- */
var slides=[], cur=0, spk=null, t0=null, fsz=+(localStorage.getItem("wb_spk_fs")||26), tick=null;

  i=Math.max(0,Math.min(N-1,i));

  var css=document.getElementById("wbcss").textContent;
  spk.document.open();
  spk.document.write("<!DOCTYPE html><html lang='de'><head><meta charset='utf-8'><title>Sprecherfenster · "+esc(META.doc_title)+"</title><style>"+css+"</style><style>"+D.spkcss+"</style></head>"+
   "<body class='spk'><div class='sh'><span class='pos' id='pos'></span><span class='tt' id='tt'></span><span class='clk' id='clk'></span>"+
   "<span class='tm' id='tm'>00:00</span><button id='tr' title='Timer zurücksetzen'>Timer neu</button><button id='am' title='Schrift kleiner'>A−</button><button id='ap' title='Schrift größer'>A+</button></div>"+
   "<div class='sm'><div id='notes'></div><div class='side'><div class='lbl'>Nächste Folie</div><div class='pv' id='pv'></div><div class='nt' id='nt'></div>"+
   "<div class='btns'><button id='bp'>◀ Zurück</button><button id='bl'>Lösung zeigen</button><button id='bn'>Weiter ▶</button></div>"+
   "<p class='hint'>Pfeiltasten, Leertaste und L wirken auch in diesem Fenster. Die Präsentation auf den Beamer ziehen und dort mit F in den Vollbildmodus schalten. Der Sprechtext ist nur hier sichtbar.</p></div></div></body></html>");
  spk.document.close();
  var sd=spk.document;
  sd.getElementById("bn").onclick=function(){go(cur+1);};
  sd.getElementById("bp").onclick=function(){go(cur-1);};
  sd.getElementById("bl").onclick=function(){sol();};
  sd.getElementById("tr").onclick=function(){t0=Date.now();updTime();};
  sd.getElementById("am").onclick=function(){fsz=Math.max(16,fsz-2);localStorage.setItem("wb_spk_fs",fsz);updSpk();};
  sd.getElementById("ap").onclick=function(){fsz=Math.min(48,fsz+2);localStorage.setItem("wb_spk_fs",fsz);updSpk();};
  sd.addEventListener("keydown",onKey);

}
function updTime(){
  if(!spk||spk.closed){ clearInterval(tick); return; }
  var d=new Date();
  spk.document.getElementById("tm").textContent=fmt(Date.now()-(t0||Date.now()));
  spk.document.getElementById("clk").textContent=(d.getHours()<10?"0":"")+d.getHours()+":"+(d.getMinutes()<10?"0":"")+d.getMinutes()+" Uhr";

  if(!spk||spk.closed) return;

  if(document.fullscreenElement){ document.exitFullscreen(); }

function onKey(e){
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  var k=e.key;

  else if(k==="ArrowLeft"||k==="ArrowUp"||k==="PageUp"||k==="Backspace"){ go(cur-1); e.preventDefault(); }
  else if(k==="Home"){ go(0); e.preventDefault(); }
  else if(k==="End"){ go(N-1); e.preventDefault(); }

  else if(k==="s"||k==="S"){ openSpk(); }

function initShow(){
